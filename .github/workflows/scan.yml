name: Scan for new jobs

on:
  schedule:
    # Hourly at minute 17 (GitHub is busiest on the hour; runs may still start late).
    - cron: "17 * * * *"
  # "Scan now" in the dashboard, or the Run workflow button on GitHub.
  workflow_dispatch:
  # Settings or sources saved from the dashboard (or edited on GitHub) apply straight away.
  push:
    branches: [main]
    paths: ["config/**"]

permissions:
  contents: write   # push the data branch

# Never run two scans at once: both would restore the same state and one would lose its results.
concurrency:
  group: job-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOTIFY_CHANNELS: telegram
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Restore saved state
        run: bash scripts/state_restore.sh "$RUNNER_TEMP/state"

      - name: Scan sources
        working-directory: backend
        run: python -m app.cli scan --state-dir "$RUNNER_TEMP/state"

      # Save before sending anything: if a later step fails, no job is forgotten or re-announced.
      - name: Save scan results
        run: bash scripts/state_save.sh "$RUNNER_TEMP/state" "scan"

      - name: Send alerts
        working-directory: backend
        run: python -m app.cli deliver --state-dir "$RUNNER_TEMP/state"

      - name: Save delivery status
        run: bash scripts/state_save.sh "$RUNNER_TEMP/state" "deliver"
